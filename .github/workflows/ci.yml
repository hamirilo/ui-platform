name: CI

# PR ごとに型検査・テスト・静的解析・配布物のビルドを実行する。
# ローカルの一括チェックは `just check` だが、CI では bun の script を直接呼ぶ。

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 変更検出
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**.md'
              - '!decisions/**'

  check:
    name: 型検査・テスト・ビルド
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: bun のセットアップ
        uses: oven-sh/setup-bun@v2

      - name: Bun キャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # 依存はすべて public レジストリから取得できる。
      - name: 依存のインストール
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun run test

      - name: lint
        run: bun run lint

      # 配布物 (dist/index.js と型定義) が壊れていないことを見る。
      # 利用側は dist だけを import するため、ここが通らないと publish できない。
      - name: build
        run: bun run build

      # Storybook は仕様書そのもの。.storybook/ や tokens/theme.css の
      # 崩れは typecheck では捕まらないため、ビルドが通ることを見る。
      - name: build-storybook
        run: bun run build-storybook

      # 上の build はこのリポジトリの node_modules を使うため、
      # 宣言漏れの依存 (phantom dependency) を検出できない。
      # 利用側を模した非巻き上げレイアウトでビルドし直して確認する。
      - name: Node のセットアップ (配布検証の npm pack / npm install 用)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 配布物の検証
        run: bun run verify:package

      # main へ入り、配布物の検証まで通ったものだけ成果物として置く（失敗した commit の
      # Storybook を配らないため、この job の最後に置く）。横断で見るための UI Catalog
      #（配信側）がこれを取りに来て配る。
      #
      # <important>
      # ここから配信サーバーへ push しない。GitHub のホストランナーからは配信側の
      # ネットワークへ届かないため、配信側が pull する。
      # 名前を storybook-static から変えるときは配信側（UI Catalog）の registry も
      # 一緒に変えること。
      # </important>
      - name: Storybook の静的成果物をアップロード（main のみ）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 30
          if-no-files-found: error

  ci:
    name: ci
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    steps:
      - name: 先行ジョブの結果を判定する
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "$RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
